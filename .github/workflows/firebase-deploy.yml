name: Deploy to Firebase Hosting

# Deploys public/ to Firebase Hosting (live channel) on every push to main.
# Auth: a Google service-account JSON stored in the
# FIREBASE_SERVICE_ACCOUNT_ZINFAI_WEB secret.
# See SETUP.md → "Continuous deployment" for how to create it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZINFAI_WEB }}
          projectId: zinfai-web
          channelId: live
